# Optional third arm (ADR 0012): Qwen3-VL-4B on page images. MOD=vl.

model:
  # Phase 0: 2 pages at 1000x1400 -> 6.2GB peak; at 1240x1754 -> 6.8GB (ADR 0008).
  base_id: unsloth/Qwen3-VL-4B-Instruct
  train_id: unsloth/Qwen3-VL-4B-Instruct-unsloth-bnb-4bit
  max_seq_length: 4096
  load_in_4bit: true

input:
  modality: vision
  # Caps vision tokens per page -- the dominant VRAM cost (ADR 0008). 1000x1400 is
  # ~1.36k vision tokens per page (32px per token after the 2x2 merge).
  max_pixels: 1400000
  dpi: 120
  augment_train: true

lora:
  r: 16
  lora_alpha: 16
  lora_dropout: 0.0
  bias: none
  # Language side only at first; the vision tower stays frozen (cheaper, and rendering
  # is clean enough that perception is not the bottleneck). Revisit with scanned data.
  finetune_vision_layers: false
  finetune_language_layers: true
  finetune_attention_modules: true
  finetune_mlp_modules: true
  use_gradient_checkpointing: unsloth
  random_state: 3407

train:
  per_device_train_batch_size: 1
  gradient_accumulation_steps: 16
  num_train_epochs: 1
  learning_rate: 2.0e-4
  lr_scheduler_type: cosine
  warmup_ratio: 0.03
  optim: adamw_8bit
  weight_decay: 0.01
  logging_steps: 10
  eval_strategy: "no"
  save_steps: 250
  save_total_limit: 3
  train_on_responses_only: true
  seed: 3407

decode:
  temperature: 0.0
  max_tokens: 1536

export:
  # One quantisation for base and tuned alike (invariant 8).
  quant: Q4_K_M

serve:
  ctx: 6144               # per slot
  parallel: 4            # slots; eval keeps this many requests in flight

paths:
  outputs_dir: outputs/qwen3vl-4b-vl
  gguf_dir: outputs/gguf
  gguf_prefix: cvx-vl
