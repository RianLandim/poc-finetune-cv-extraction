# Difficulty probe: smoke.run=probe, used by docs/probe/2026-10-01-templates.md.
# python scripts/01_generate_cvs.py --config configs/data-probe.yaml --smoke [--templates a,b]
# Synthetic resume generation and splits, shared by both modalities (ADR 0002-0004).
# Scripts must never hardcode a value that lives here.

source:
  hf_dataset: nvidia/Nemotron-Personas-Brazil
  # The dataset spans 18-100; past 65 a resume is implausible.
  min_age: 18
  max_age: 65

generate:
  n_resumes: 6000          # one resume per persona (splits.py relies on this)
  seed: 3407
  # Probability that an optional field is rendered at all; hidden => null in the gold.
  p_show:
    email: 0.95
    telefone: 0.9
    linkedin: 0.4
    resumo: 0.7
    idiomas: 0.6
    descricao: 0.75     # per job
    exp_cidade: 0.4     # per job
  max_pages: 2
  teacher:
    # Writes only resumo/descricao (ADR 0003); prose is never scored, so a small, fast
    # model is enough. `make teacher` downloads and serves this GGUF. --teacher-url none
    # skips the teacher, and those fields stay null.
    hf_repo: unsloth/Qwen3.5-4B-GGUF
    hf_file: Qwen3.5-4B-Q4_K_M.gguf
    parallel: 4            # llama-server slots; each gets ctx / parallel tokens
    ctx: 8192
    base_url: http://127.0.0.1:8080
    temperature: 0.8
    top_p: 0.9
    max_tokens: 600
  run: full                # subdirectory of cvs_dir and datasets_dir
  workers: 6               # generation processes; teacher calls are the bottleneck

templates:
  # Every *.html.j2 in src/cvx/templates/ is a template; ids are file stems.
  holdout_frac: 0.2        # whole templates reserved for test_unseen (ADR 0004)

splits:
  val_frac: 0.05
  test_frac: 0.05          # test_seen, on top of every test_unseen resume
  seed: 3407

smoke:
  n_resumes: 200
  run: probe

paths:
  cvs_dir: data/cvs        # <run>/cv_000123.{json,pdf,txt,meta.json} (+ -p1.png ...)
  datasets_dir: data/datasets
  real_test_dir: data/real_test
