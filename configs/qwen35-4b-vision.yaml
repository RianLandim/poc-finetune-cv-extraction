# Vision modality: page images in, JSON out. Same base model as text (ADR 0012).

model:
  # Natively multimodal (Qwen3_5ForConditionalGeneration), hybrid attention: 24 Gated
  # DeltaNet + 8 full-attention layers, vocab 248k. No pre-quantised bnb checkpoint
  # exists; Unsloth quantises the 9.3GB bf16 weights at load (3.2GB on GPU after load).
  base_id: unsloth/Qwen3.5-4B
  train_id: unsloth/Qwen3.5-4B
  # Phase 0: 2 pages at 1000x1400 -> 5.0GB peak; at 1240x1754 -> 5.6GB (ADR 0008).
  max_seq_length: 4096
  load_in_4bit: true

input:
  modality: vision
  # 1000x1400 is ~1.36k vision tokens per page (32px per token after the 2x2 merge).
  max_pixels: 1400000
  # A4 at 120 dpi is 992x1403, aligned to 992x1408 (cvx.generate.rasterize).
  dpi: 120
  # Train rows only: this share gets a scan-like page (rotation, blur, JPEG, tinted
  # paper) instead of the clean render. Test pages are always clean.
  augment_train: true
  augment_frac: 0.5

lora:
  # Language side only at first; the vision tower stays frozen, so base and tuned share
  # one mmproj (ADR 0012).
  finetune_vision_layers: false
  r: 16
  lora_alpha: 16
  lora_dropout: 0.0
  bias: none
  target_modules: [q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj]
  use_gradient_checkpointing: unsloth
  random_state: 3407

train:
  per_device_train_batch_size: 1
  gradient_accumulation_steps: 16
  group_by_length: true
  num_train_epochs: 1
  learning_rate: 2.0e-4
  lr_scheduler_type: cosine
  warmup_ratio: 0.03
  optim: adamw_8bit
  weight_decay: 0.01
  logging_steps: 10
  # Inherited lesson from the persona repo: an in-training eval pass materialises full
  # fp32 logits and can OOM an 8GB card that trains fine. Re-measure before enabling.
  eval_strategy: "no"
  save_steps: 250
  save_total_limit: 3
  # Loss on the assistant turn only: the resume text is input, not something to learn.
  train_on_responses_only: true
  seed: 3407

decode:
  # Extraction is not creative: greedy.
  temperature: 0.0
  max_tokens: 1536

export:
  # One quantisation for base and tuned alike (invariant 8).
  quant: Q4_K_M

serve:
  ctx: 6144               # per slot
  parallel: 4            # slots; eval keeps this many requests in flight

paths:
  outputs_dir: outputs/qwen35-4b-vision
  gguf_dir: outputs/gguf
  gguf_prefix: cvx-vision
